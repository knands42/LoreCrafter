name: Test Pipeline

on:
  pull_request:
    branches:
      - main
      - develop

env:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  POSTGRES_DB: "lorecrafter_test"
  POSTGRES_URL: "postgresql://postgres:postgres@localhost:5433/lorecrafter_test?sslmode=disable"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    environment: dev

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '^1.23.0'
          check-latest: true

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/go/pkg/mod
            ~/go/bin
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod download

      - name: Wait for PostgreSQL
        run: |
          for i in {1..10}; do
            if pg_isready -h localhost -p 5433 -U postgres; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL to be ready..."
            sleep 2
          done

      - name: Run tests
        id: tests
        env:
          POSTGRES_URL: ${{ env.POSTGRES_URL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTROPIC_API_KEY: ${{ secrets.ANTROPIC_API_KEY }}
          PASETO_PRIVATE_KEY: ${{ secrets.PASETO_PRIVATE_KEY }}
          PASETO_PUBLIC_KEY: ${{ secrets.PASETO_PUBLIC_KEY }}
          PASSWORD_SALT: ${{ secrets.PASSWORD_SALT }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          TOKEN_EXPIRY: ${{ secrets.TOKEN_EXPIRY }}
          PROFILE: ${{ secrets.PROFILE }}
          EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
          EMAIL_DOMAIN: ${{ secrets.EMAIL_DOMAIN }}
          RUN_AI_TESTS: false
        run: |
          PACKAGES=$(go list ./... | grep -v "docs\|pkg")
          go test -v ./... -coverprofile=coverage.out -covermode=atomic $(shell go list ./... | grep -v "docs\|pkg")
          echo "coverage_path=$(pwd)/coverage.out" >> $GITHUB_OUTPUT

      - name: Report coverage to Codecov
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
          CODACY_ORGANIZATION_PROVIDER: ${{ secrets.CODACY_ORGANIZATION_PROVIDER }}
          CODACY_PROJECT_NAME: ${{ secrets.CODACY_PROJECT_NAME }}
          CODACY_USERNAME: ${{ secrets.CODACY_USERNAME }}
        run: |
          bash <(curl -Ls https://coverage.codacy.com/get.sh) report \
              --force-coverage-parser go -r ${{ steps.tests.outputs.coverage_path }}
        continue-on-error: true
